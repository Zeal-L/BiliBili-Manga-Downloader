[tool.poetry]
authors = ["Zeal-L <zeal.liang@gmail.com>"]
description = "一个好用的哔哩哔哩漫画下载器，支持通过浏览器保存章节图片的原始网络响应，并保留漫画管理和多种保存格式。"
license = "AGPL-3.0"
name = "bilibili-manga-downloader"
readme = "README.md"
version = "1.5.1"

[tool.poetry.dependencies]
beautifulsoup4 = "^4.12.3"
cryptography = "^46.0.0"
piexif = "^1.1.3"
pillow = "^12.3.0"
playwright = "^1.64.1"
py7zr = "^0.20.8"
pypdf = "^4.0.2"
pypinyin = "^0.49.0"
pyside6 = "^6.12.0"
python = ">=3.13,<3.16"
qrcode = "^7.4.2"
qt-material = "^2.14"
requests = "^2.32.5"
retrying = "^1.3.4"

[tool.poetry.group.dev.dependencies]
auto-py-to-exe = "^2.42.0"
pyinstaller = "^6.4.0"
rich = "^13.7.0"
ruff = "^0.2.2"

[[tool.poetry.source]]
name = "mirrors"
priority = "supplemental"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.ruff]
line-length = 100
